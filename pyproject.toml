[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorcad"
version = "0.0.1"
description = "Cálculo da posição de motor sobre chapa-guia inclinada (base tensora) e exportação para AutoCAD."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "ezdxf>=1.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.4",
]
build = ["pyinstaller>=6.0"]

[project.scripts]
tensorcad = "tensorcad.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tensorcad = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N802", "N803", "N806", "N815", "N818"]  # nomes técnicos (H, A, K, R, Cx...) são intencionais

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
