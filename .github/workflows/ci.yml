name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar LibreOffice (recálculo da calculadora)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui
          soffice --version
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Instalar Playwright (teste da interface no navegador)
        if: runner.os == 'Linux'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest
        env:
          TENSORCAD_EXIGIR_SOFFICE: ${{ runner.os == 'Linux' && '1' || '' }}
          TENSORCAD_EXIGIR_NAVEGADOR: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Cobertura do núcleo geométrico (>= 95%)
        run: pytest tests/test_geometry.py -q --cov=tensorcad.geometry --cov-report=term-missing --cov-fail-under=95
