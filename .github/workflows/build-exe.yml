name: Executável Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar release com esta tag (ex.: v0.6.37); vazio = só build"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: [develop]
    paths:
      - "src/**"
      - "data/**"
      - "scripts/build_exe.py"
      - "pyproject.toml"
      - ".github/workflows/build-exe.yml"
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "scripts/build_exe.py"
      - "pyproject.toml"
      - ".github/workflows/build-exe.yml"

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      contents: write  # publicar o .exe na pré-release exe-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"
      - name: Gerar tensorcad.exe
        run: python scripts/build_exe.py
      - name: Testar o executável sem Python no PATH
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\tensorcad.exe"
          $dir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "exe-teste")
          Set-Location $dir
          $env:PATH = "C:\Windows\System32;C:\Windows"
          if (Get-Command python -ErrorAction SilentlyContinue) { throw "python ainda no PATH" }
          function Rodar { param([string[]]$a) $s = & $exe @a 2>&1 | Out-String; Write-Host $s; if ($LASTEXITCODE) { throw "falhou: $a" }; return $s }
          Rodar @("--versao") | Out-Null
          Rodar @("--help") | Out-Null
          Rodar @("validar") | Out-Null
          $r = Rodar @("caso","--projeto","ref.xlsx","--id","REF-180","--carcaca","180M","--rmin","2086","--rmax","2161","--cota","1646")
          if ($r -notmatch "REF-180: OK") { throw "REF-180 deveria ser OK (chapa CH-180 real)" }
          $r = Rodar @("caso","--projeto","ref.xlsx","--id","LONGO","--carcaca","180M","--rmin","2086","--rmax","2300")
          if ($r -notmatch "LONGO: FORA_RANHURA") { throw "LONGO deveria ser FORA_RANHURA" }
          $r = Rodar @("caso","--projeto","ref.xlsx","--id","ALT","--carcaca","180M","--rmin","2086","--rmax","2110")
          if ($r -notmatch "ALT: OK") { throw "ALT deveria ser OK" }
          Rodar @("lote","--saida","out","--passo","50") | Out-Null
          "p2`nP`nX`n180M`n2086`n2110`n`nn`nn`n" | & $exe interativo | Out-Host
          # interface web: sobe o servidor sem navegador e consulta a API e a página
          $srv = Start-Process -FilePath $exe -ArgumentList "web","--sem-navegador","--porta","8799" -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
              Start-Sleep -Milliseconds 500
              try { $saude = Invoke-RestMethod "http://127.0.0.1:8799/api/saude"; $ok = $true } catch {}
            }
            if (-not $ok) { throw "servidor web não respondeu" }
            if ($saude.status -ne "ok") { throw "saude: $($saude | ConvertTo-Json)" }
            $carc = Invoke-RestMethod "http://127.0.0.1:8799/api/carcacas"
            if (-not ($carc | Where-Object { $_.carcaca -eq "180" -and $_.calculavel })) { throw "carcaça 180 indisponível" }
            $pag = Invoke-WebRequest "http://127.0.0.1:8799/" -UseBasicParsing
            if ($pag.Content -notmatch "tensorcad") { throw "página inicial inválida" }
          } finally { Stop-Process -Id $srv.Id -Force }
          foreach ($f in "ref.xlsx","p2.xlsx","out\resultados.csv","out\resultados.xlsx") {
            if (-not (Test-Path $f)) { throw "faltou $f" }
          }
      - name: Publicar a release da tag (v*)
        # Tag vX.Y.Z (push da tag ou execução manual com release_tag): release com o .exe
        # testado acima; versões 0.x saem como pré-release. A tag precisa bater com a versão
        # do pacote; as notas vêm de docs/notas_release/<tag>.md. Na execução manual a tag é
        # criada no commit do build.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $versao = (Select-String -Path src/tensorcad/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$versao" -ne $env:TAG) { throw "tag $env:TAG diferente da versão do pacote ($versao)" }
          $notas = "docs/notas_release/$env:TAG.md"
          if (-not (Test-Path $notas)) { throw "faltou $notas" }
          $sha = (Get-FileHash dist/tensorcad.exe -Algorithm SHA256).Hash.ToLower()
          Add-Content $notas "`n`nCommit: $env:GITHUB_SHA`n`nSHA-256 do tensorcad.exe: $sha"
          $pre = @()
          if ($versao.StartsWith("0.")) { $pre = @("--prerelease") }
          $alvo = @("--verify-tag")
          if ($env:GITHUB_REF -notlike "refs/tags/*") { $alvo = @("--target", $env:GITHUB_SHA) }
          gh release create $env:TAG dist/tensorcad.exe docs/executavel.md --title "tensorcad $versao" --notes-file $notas @alvo @pre
          if ($LASTEXITCODE) { throw "falha ao criar a release $env:TAG" }
          exit 0
      - name: Publicar na pré-release exe-dev
        # Anexos de release não contam na cota de artefatos do Actions.
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          ORIGEM: ${{ github.head_ref || github.ref_name }}
        run: |
          $tag = "exe-dev"
          $notas = "Build de desenvolvimento do tensorcad.exe (substituído a cada build).`n`nCommit: $env:COMMIT`nBranch: $env:ORIGEM`nData: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC`n`nTestado no Windows sem Python no PATH (validar, casos REF-180/ALT, lote, modo interativo)."
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --target $env:COMMIT --title "tensorcad.exe (desenvolvimento)" --notes $notas
            if ($LASTEXITCODE) { throw "falha ao criar a pré-release" }
          } else {
            gh release edit $tag --prerelease --notes $notas
            if ($LASTEXITCODE) { throw "falha ao editar a pré-release" }
          }
          gh release upload $tag dist/tensorcad.exe docs/executavel.md --clobber
          if ($LASTEXITCODE) { throw "falha ao enviar o .exe" }
          exit 0
      - uses: actions/upload-artifact@v4
        # A falta de cota de armazenamento da conta não reprova o build já testado: o .exe
        # fica na pré-release exe-dev ou na release da tag.
        continue-on-error: true
        with:
          name: tensorcad-exe
          path: |
            dist/tensorcad.exe
            docs/executavel.md
          if-no-files-found: error
          retention-days: 14
